# platforms.conf — 實測 harness 要跑的平台清單
#
# 文法：一行一個平台，四個欄位用「|」隔開，欄位前後的空白會被忽略。
#   <平台層>|<podman 映像>|<lxc 樣板參數>|<vm 映像網址>
# 平台層：mksctl 的層名，也是 verified.conf 的第二欄，例如 ubuntu-24.04。
# podman 映像：podman run 用的完整映像參照。
# lxc 樣板參數：lxc-create -t download -- 後面的三個參數。
# vm 映像網址：官方 cloud image，快取在 .cache/vm/base-<平台層>.qcow2。
# 空行與「#」開頭的行會被略過。
alpine-3.24  | quay.io/flysangel/library/alpine:3.24 | -d alpine -r 3.24 -a amd64    | https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/alpine-3.24.3-x86_64-cloudinit-r0.qcow2
ubuntu-24.04 | quay.io/flysangel/library/ubuntu:24.04 | -d ubuntu -r noble -a amd64    | https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
ubuntu-26.04 | quay.io/flysangel/library/ubuntu:26.04 | -d ubuntu -r resolute -a amd64 | https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img
