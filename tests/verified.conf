# verified.conf — lxc 與 vm 層實測通過的紀錄
#
# 文法：一行一筆，五個欄位用空白隔開。
#   <配方> <平台層> <venue> <內容雜湊> <UTC 日期>
# 內容雜湊：bash bin/verified-hash.sh <配方> 的輸出。雜湊變了，代表紀錄過期。
# UTC 日期：格式 YYYY-MM-DD。
# 由 tests/lib/harness.sh 在 lxc 或 vm 層的 [OK] 後更新；同一個「配方 平台層 venue」只留一行。
# 空行與「#」開頭的行會被略過。
