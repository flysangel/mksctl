# pkgmap.yaml — 邏輯套件名稱對照表
#
# 格式：邏輯名稱 → { 平台層: [實際套件名稱] | null }
#   [] 代表該平台不需要這個套件（沒有東西要裝）。
#   null 代表該平台沒有這個套件（preflight 會擋下）。
#   沒有登記的邏輯名稱，各平台都原樣當成套件名稱。
# 平台層用 apk（alpine）與 apt（ubuntu）。

# 兩個發行版同一概念、套件名稱不同
openssh-client: { apt: [ssh] }
p7zip: { apt: [p7zip-full] }
gettext: { apt: [gettext-base] }
netcat: { apk: [netcat-openbsd], apt: [ncat] }
bind-tools: { apt: [dnsutils] }
iputils: { apt: [inetutils-ping] }

# 只有 alpine 需要（ubuntu 預設已含，或沒有對應套件）
yq: { apt: [] }
e2fsprogs: { apt: [] }
grep: { apt: [] }
util-linux: { apt: [] }
coreutils: { apt: [] }
findutils: { apt: [] }
binutils: { apt: [] }
procps: { apt: [] }
open-vm-tools-guestinfo: { apt: [] }

# 只有 ubuntu 需要（alpine 用 busybox 或沒有對應套件）
software-properties-common: { apk: [] }
rsyslog: { apk: [] }
net-tools: { apk: [] }
iproute2: { apk: [] }
iftop: { apk: [] }
traceroute: { apk: [], apt: [inetutils-traceroute] }

# ntp：ubuntu 26.04 起沒有 ntpdate，改裝 ntpsec-ntpdate（22.04 到 26.04 都有）；
# alpine 用 busybox 的 ntpd，不需要 ntpdate（[] 代表不用裝；null 會被 preflight 擋下）
ntpdate: { apk: [], apt: [ntpsec-ntpdate] }

# docker：ubuntu 的套件名稱就是邏輯名稱；alpine 的 docker 套件已含 cli 與 containerd
docker-ce: { apk: [docker] }
docker-ce-cli: { apk: [] }
containerd.io: { apk: [] }
docker-buildx-plugin: { apk: [docker-cli-buildx] }
docker-compose-plugin: { apk: [docker-cli-compose] }
